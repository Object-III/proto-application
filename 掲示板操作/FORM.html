<script type="text/javascript">
var lastCheckedSubjectRadio = null;
function toggleSubjectRadio(radio) {
  var subjectBox = document.getElementById("subjectBox");
  if (lastCheckedSubjectRadio === radio) {
    radio.checked = false;
    lastCheckedSubjectRadio = null;
    if (subjectBox.value === radio.value) {
      subjectBox.value = "";
    }
  } else {
    lastCheckedSubjectRadio = radio;
    subjectBox.value = radio.value;
  }
}
</script>
